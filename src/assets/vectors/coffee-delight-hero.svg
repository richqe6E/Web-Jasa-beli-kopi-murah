<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="320" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="cupDrink" x1="160" y1="68" x2="160" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="42%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="milkSwirl" x1="120" y1="115" x2="205" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="24" fill="url(#bgSky)"/>
  <circle cx="62" cy="48" r="36" fill="#BFDBFE" fill-opacity="0.55"/>
  <circle cx="268" cy="176" r="46" fill="#93C5FD" fill-opacity="0.35"/>

  <!-- Floating Discount Ticket -->
  <g transform="translate(26, 78) rotate(-8)">
    <rect width="74" height="44" rx="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
    <rect x="6" y="6" width="62" height="32" rx="7" fill="#E3F0FF"/>
    <text x="37" y="21" text-anchor="middle" fill="#0B6BCB" font-family="sans-serif" font-size="11" font-weight="800">HEMAT</text>
    <text x="37" y="33" text-anchor="middle" fill="#E11D48" font-family="monospace" font-size="11" font-weight="800">-50%</text>
  </g>

  <!-- Floating WA Ready Pill -->
  <g transform="translate(214, 42) rotate(6)">
    <rect width="84" height="38" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.2"/>
    <circle cx="18" cy="19" r="9" fill="#22C55E"/>
    <path d="M14.5 19L17 21.5L21.5 16.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="33" y="17" fill="#0F172A" font-family="sans-serif" font-size="8.5" font-weight="800">Siap Order</text>
    <text x="33" y="27" fill="#047857" font-family="sans-serif" font-size="8" font-weight="700">Via WA</text>
  </g>

  <!-- Cup Shadow -->
  <ellipse cx="160" cy="194" rx="56" ry="10" fill="#0B6BCB" fill-opacity="0.16"/>

  <!-- Straw -->
  <path d="M174 20L188 18L168 78" stroke="#0B6BCB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M174 20L188 18L168 78" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Iced Coffee Cup Body -->
  <path d="M114 70H206L194 182C193.3 187.8 188.4 192 182.6 192H137.4C131.6 192 126.7 187.8 126 182L114 70Z" fill="url(#cupDrink)" stroke="#0F172A" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Milk Swirl Layer -->
  <path d="M119 116C136 126 154 106 172 118C184 126 194 120 201 114L194 182C193.3 187.8 188.4 192 182.6 192H137.4C131.6 192 126.7 187.8 126 182L119 116Z" fill="url(#milkSwirl)" fill-opacity="0.92" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Ice Cubes -->
  <rect x="134" y="84" width="18" height="18" rx="4" fill="#EFF6FF" fill-opacity="0.92" stroke="#0F172A" stroke-width="2" transform="rotate(-12 134 84)"/>
  <rect x="166" y="88" width="18" height="18" rx="4" fill="#DBEAFE" fill-opacity="0.92" stroke="#0F172A" stroke-width="2" transform="rotate(14 166 88)"/>

  <!-- Dome Lid -->
  <path d="M116 70C116 46 135.7 32 160 32C184.3 32 204 46 204 70H116Z" fill="#FFFFFF" fill-opacity="0.72" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="108" y="64" width="104" height="12" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>

  <!-- Cute Cup Sleeve Badge -->
  <rect x="138" y="136" width="44" height="28" rx="9" fill="#0B6BCB" stroke="#0F172A" stroke-width="2.2"/>
  <circle cx="152" cy="147" r="2.2" fill="#FFFFFF"/>
  <circle cx="168" cy="147" r="2.2" fill="#FFFFFF"/>
  <path d="M155 154C157.5 157 162.5 157 165 154" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Sparkles -->
  <path d="M236 122L239 114L242 122L250 125L242 128L239 136L236 128L228 125L236 122Z" fill="#0B6BCB"/>
  <path d="M78 148L80 142L82 148L88 150L82 152L80 158L78 152L72 150L78 148Z" fill="#F59E0B"/>
